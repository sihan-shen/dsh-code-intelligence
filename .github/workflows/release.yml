name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify release (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.6.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Verify tag version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$tag" == "$version" ]]
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:package-entry:built
      - name: Create package archive
        if: matrix.node == '22.19.0'
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Verify clean consumer
        if: matrix.node == '22.19.0'
        run: node scripts/ci/verify-tarball.mjs "$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22.19.0'
        with:
          name: npm-package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Install approved npm version
        run: |
          npm install --global npm@11.5.2
          npm_version="$(npm --version)"
          test "$npm_version" = '11.5.2'
      - name: Download verified archive
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
      - name: Publish with npm trusted publishing
        run: npm publish "$(find "$RUNNER_TEMP/package" -name '*.tgz' -print -quit)" --provenance --access public --tag next

  github-release:
    name: Create GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-assets
      - name: Create prerelease and upload archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.tgz --generate-notes --title "$GITHUB_REF_NAME" --prerelease
